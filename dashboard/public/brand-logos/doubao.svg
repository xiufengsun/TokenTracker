<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
  <!-- Doubao (豆包) wordless mark: the 豆 ("bean") glyph as geometric bars,
       drawn mono in currentColor for dark/light theming. No official
       monochrome mark is published, so this is an original trace. -->
  <rect x="4" y="3" width="16" height="2.4" rx="1.2"/>
  <rect x="7.2" y="7.6" width="9.6" height="5.6" rx="1.2" fill="none" stroke="currentColor" stroke-width="2"/>
  <rect x="8.5" y="15" width="2.6" height="2.2" rx="1.1"/>
  <rect x="12.9" y="15" width="2.6" height="2.2" rx="1.1"/>
  <rect x="4" y="18.6" width="16" height="2.4" rx="1.2"/>
</svg>
