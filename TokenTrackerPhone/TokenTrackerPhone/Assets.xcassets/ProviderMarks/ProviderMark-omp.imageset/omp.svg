<svg width="56" height="56" viewBox="0 0 120 90" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="oh-my-pi">
  <title>oh-my-pi</title>
  <defs>
    <linearGradient id="ompBar" x1="10" y1="14" x2="110" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="45%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="ompLeft" x1="31" y1="20" x2="31" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="ompRight" x1="81" y1="20" x2="81" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="ompPlug" x1="71" y1="55" x2="91" y2="79" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
  </defs>
  <!-- Horizontal bar of pi -->
  <rect x="10" y="8" width="100" height="12" rx="3" fill="url(#ompBar)"/>
  <!-- Left leg -->
  <rect x="25" y="20" width="12" height="62" rx="3" fill="url(#ompLeft)"/>
  <!-- Right leg (shortened for connector) -->
  <rect x="75" y="20" width="12" height="45" rx="3" fill="url(#ompRight)"/>
  <!-- Plugin connector block -->
  <rect x="71" y="55" width="20" height="16" rx="4" fill="url(#ompPlug)"/>
  <!-- Connector prongs -->
  <rect x="76" y="71" width="3.5" height="9" rx="1.2" fill="#FB7185"/>
  <rect x="82.5" y="71" width="3.5" height="9" rx="1.2" fill="#FB7185"/>
</svg>
