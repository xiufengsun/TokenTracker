name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # A main commit that changes package.json is the immutable npm candidate.
  # Cancelling it lets a later, same-version commit publish code that never
  # existed at the version bump SHA. Keep main runs; only supersede PR runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: test + validate + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24 matches the maintainer's local toolchain. The test suite
          # imports dashboard .ts files directly (native type stripping, Node
          # 22.18+) and exercises undici 8 (needs webidl.markAsUncloneable), so
          # Node 20 cannot run the suite even though the published CLI targets it.
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install dashboard dependencies
        run: npm ci --prefix dashboard

      # Build the dashboard up front: the local-runtime install test asserts the
      # bundled dashboard/dist/index.html exists, and a fresh checkout has none.
      # VITE_* are public client-side values shipped in every dashboard bundle;
      # absent at build time Vite inlines empty strings and breaks leaderboard
      # fetch + cloud OAuth. dashboard/.env.local is gitignored, hence inlined here.
      - name: Build dashboard
        env:
          VITE_INSFORGE_BASE_URL: https://srctyff5.us-east.insforge.app
          VITE_INSFORGE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3OC0xMjM0LTU2NzgtOTBhYi1jZGVmMTIzNDU2NzgiLCJlbWFpbCI6ImFub25AaW5zZm9yZ2UuY29tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNDU5NDd9.T0auta_IrVIh0uXW1bob5QSnzvsnJmN28r5XkSGEuQY
        run: npm run dashboard:build

      - name: Test skill management interactions
        run: npm --prefix dashboard test -- src/pages/SkillsPage.test.jsx

      - name: Test dashboard limits preferences
        run: npm --prefix dashboard test -- src/hooks/use-limits-display-prefs.test.js

      # The bot character's renderer and its cross-host contracts live on the dashboard
      # side, so npm test alone does not cover them; test/bot-parity.test.js only pins
      # the values, not the rendering.
      - name: Test bot companion renderer
        run: npm --prefix dashboard test -- src/ui/foundation/BotAnimated.test.jsx src/lib/pets-api.test.js

      # Same checks as `npm run ci:local`, with the dashboard build hoisted above.
      - name: Test and validate
        run: |
          npm test
          npm run validate:copy
          npm run validate:locale
          npm run validate:ui-hardcode
          npm run validate:guardrails
          npm run validate:versions
          npm run validate:bot-frames
          node --test test/architecture-guardrails.test.js

  linux-client:
    name: Linux client (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # webkit2gtk + friends are needed to COMPILE the tauri crate, even though
      # nothing here launches a webview. Bundling the release packages
      # (AppImage, .deb, .rpm) is deliberately left to the release workflow:
      # they need the ~100MB embedded Node runtime plus appimagetool and the
      # rpm tooling, which would slow every PR down for no extra signal.
      - name: Install Tauri build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: TokenTrackerLinux/src-tauri

      - name: Check formatting
        working-directory: TokenTrackerLinux/src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: TokenTrackerLinux/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        working-directory: TokenTrackerLinux/src-tauri
        run: cargo test --locked

  macos-tests:
    name: macOS unit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install dashboard dependencies
        run: npm ci --prefix dashboard

      # Same reason as the Linux job: the local-runtime install test asserts the
      # bundled dashboard/dist/index.html exists, and a fresh checkout has none.
      - name: Build dashboard
        env:
          VITE_INSFORGE_BASE_URL: https://srctyff5.us-east.insforge.app
          VITE_INSFORGE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3OC0xMjM0LTU2NzgtOTBhYi1jZGVmMTIzNDU2NzgiLCJlbWFpbCI6ImFub25AaW5zZm9yZ2UuY29tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNDU5NDd9.T0auta_IrVIh0uXW1bob5QSnzvsnJmN28r5XkSGEuQY
        run: npm run dashboard:build

      # The whole suite, not a hand-picked pair of files: host assumptions that
      # only hold on GNU userland (coreutils, GNU sed, ...) are invisible to the
      # Linux job by construction, and `npm test` is what CONTRIBUTING asks
      # contributors to run before opening a PR.
      - name: Test suite on macOS
        run: npm test

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: TokenTrackerBar
        run: xcodegen generate

      - name: Patch pbxproj for icon
        working-directory: TokenTrackerBar
        run: ruby scripts/patch-pbxproj-icon.rb

      - name: Test TokenTrackerBar
        working-directory: TokenTrackerBar
        run: |
          xcodebuild test \
            -scheme TokenTrackerBarTests \
            -destination 'platform=macOS'

  windows-build:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Windows root dependencies
        run: npm ci

      # WAL fixtures launch the SQLite CLI in addition to Node's SQLite
      # reader. Pin the official Windows tools and verify SQLite's published
      # SHA3-256 before extraction; this is a test dependency only.
      - name: Install SQLite for Windows test fixtures
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'sqlite-tools-win-x64-3540000.zip'
          Invoke-WebRequest 'https://www.sqlite.org/2026/sqlite-tools-win-x64-3540000.zip' -OutFile $archive
          $verify = @'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const bytes = fs.readFileSync(process.argv[1]);
          if (bytes.length !== 6982216 || crypto.createHash('sha3-256').update(bytes).digest('hex') !== '8d1ccff873455c7f83c6e03ee253e81406d0e432ca9e7247ed6183929a824b33') throw Error('SQLite fixture tool checksum mismatch');
          '@
          node -e $verify $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tools = Join-Path $env:RUNNER_TEMP 'tokentracker-sqlite-test-tools'
          Expand-Archive -LiteralPath $archive -DestinationPath $tools
          $tools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $tools 'sqlite3.exe') --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Windows updater
        run: dotnet test TokenTrackerWin.Tests/TokenTrackerWin.Tests.csproj --configuration Release

      - name: Build TokenTrackerWin
        run: dotnet build TokenTrackerWin/TokenTrackerWin.csproj --configuration Release

      # Build review artifacts before a release so package/installer failures
      # are caught without publishing a tag or changing public assets.
      - name: Install Windows dashboard dependencies
        run: npm ci --prefix dashboard --no-audit --no-fund

      - name: Validate Windows TypeScript and retrospective references
        run: node --test test/dashboard-typescript-guardrails.test.js test/validate-retros.test.js

      - name: Build Windows dashboard with pet and quota
        env:
          VITE_INSFORGE_BASE_URL: https://srctyff5.us-east.insforge.app
          VITE_INSFORGE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3OC0xMjM0LTU2NzgtOTBhYi1jZGVmMTIzNDU2NzgiLCJlbWFpbCI6ImFub25AaW5zZm9yZ2UuY29tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNDU5NDd9.T0auta_IrVIh0uXW1bob5QSnzvsnJmN28r5XkSGEuQY
          TOKENTRACKER_BUILD_PET: "1"
        run: npm run dashboard:build

      # Build first because local-runtime tests verify dashboard/dist. Keep
      # the Windows suite equivalent to Linux/macOS rather than selecting
      # only already-known native paths. POSIX-only fixtures report skips.
      - name: Test suite on Windows
        run: node --test --test-timeout=120000 --test-concurrency=4 test/*.test.js

      - name: Bundle and verify Windows review package
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File TokenTrackerWin/scripts/bundle-node.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish TokenTrackerWin/TokenTrackerWin.csproj -c Release -r win-x64 --self-contained true -o TokenTrackerWin/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item TokenTrackerWin/EmbeddedServer TokenTrackerWin/publish/EmbeddedServer -Recurse
          node scripts/verify-windows-package.cjs TokenTrackerWin/publish windows-package-manifest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path TokenTrackerWin/publish/* -DestinationPath TokenTracker-review-win-x64.zip

      # The shipped runtime is Node22, while build tooling uses Node24. Test
      # the actual bundled binary too so native fs/undici regressions cannot
      # hide behind a successful run on a different Node major.
      - name: Test suite with the bundled Windows Node runtime
        run: .\TokenTrackerWin\publish\EmbeddedServer\node.exe --test --test-timeout=120000 --test-concurrency=4 test/*.test.js

      - name: Compile Windows review installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) { throw 'Preinstalled Inno Setup 6 compiler unavailable' }
          $version = node -p "require('./package.json').version"
          & $iscc "/DMyAppVersion=$version" TokenTrackerWin/installer/TokenTracker.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows review artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-review-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            TokenTracker-review-win-x64.zip
            TokenTrackerWin/installer/Output/TokenTracker-Setup-v*.exe
            windows-package-manifest.json
