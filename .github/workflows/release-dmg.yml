name: release (macOS + Windows + Linux)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.5.25)"
        required: true
        type: string
      no_cache:
        description: "Disable all caches (rollback switch)"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-dmg
  cancel-in-progress: false

jobs:
  # Create the vX.Y.Z release as a DRAFT first, so the macOS and Windows build
  # jobs can upload their assets to it IN PARALLEL while it stays invisible.
  # Drafts are excluded from releases/latest and the public releases page, so
  # consumers (the Homebrew tap, the landing "Download" deep-link, anyone
  # browsing) never see a half-published release — releases/latest stays on the
  # PREVIOUS complete version until the publish job flips this one live, once
  # every asset is attached. Cheap (~10s on ubuntu).
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify release source and versions
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const version = process.env.VERSION;
          if (!/^\d+\.\d+\.\d+$/.test(version)) {
            throw new Error(`Invalid release version: ${version}`);
          }

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const project = fs.readFileSync("TokenTrackerBar/project.yml", "utf8");
          const csproj = fs.readFileSync("TokenTrackerWin/TokenTrackerWin.csproj", "utf8");
          const marketingVersions = [...project.matchAll(/MARKETING_VERSION:\s*"([^"]+)"/g)]
            .map((match) => match[1]);
          // The shared registry covers every managed file, including the Linux
          // client's Cargo.toml / Cargo.lock / tauri.conf.json / PKGBUILD, so
          // adding a platform never needs a new hand-written check here.
          const { collectVersionEntries } = require("./scripts/version-files.cjs");
          const checks = [
            ["package.json", pkg.version],
            ["package-lock.json", lock.version],
            ["package-lock.json root package", lock.packages?.[""]?.version],
            ...marketingVersions.map((value, index) => [`MARKETING_VERSION #${index + 1}`, value]),
            ["TokenTrackerWin.csproj", csproj.match(/<Version>([^<]+)<\/Version>/)?.[1]],
            ...collectVersionEntries(process.cwd()).map(({ label, version }) => [label, version]),
          ];

          if (marketingVersions.length === 0) {
            throw new Error("No MARKETING_VERSION entries found in TokenTrackerBar/project.yml");
          }
          for (const [source, actual] of checks) {
            if (actual !== version) {
              throw new Error(`${source} version (${actual ?? "missing"}) does not match ${version}`);
            }
          }
          NODE

      # A failed release may be re-dispatched from the SAME commit and replace
      # draft assets. A published release is immutable and can never be reused.
      # If the release is missing but its tag still exists, the version was
      # already consumed (or partially created) and must not be reconstructed.
      - name: Create or reuse matching draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"

          if release_json=$(gh release view "$tag" --json isDraft,targetCommitish 2>/dev/null); then
            if [ "$(jq -r '.isDraft' <<<"$release_json")" != "true" ]; then
              echo "::error::Release $tag is already published. Published assets are immutable; bump the version instead."
              exit 1
            fi

            # GitHub does not materialize the tag ref for a draft release until
            # publication. Create it explicitly so parallel builders can check
            # out the immutable tag while the release is still safely private.
            # Once the tag exists, GitHub may report targetCommitish as the
            # default branch (for example "main"), so the tag SHA is the source
            # of truth for retry safety. targetCommitish is only authoritative
            # for an older/incomplete draft that has no tag yet.
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
              tag_sha=$(git rev-list -n 1 "$tag")
              if [ "$tag_sha" != "$GITHUB_SHA" ]; then
                echo "::error::Tag $tag points to $tag_sha, not workflow commit $GITHUB_SHA."
                exit 1
              fi
            else
              draft_sha=$(jq -r '.targetCommitish' <<<"$release_json")
              if [ "$draft_sha" != "$GITHUB_SHA" ]; then
                echo "::error::Draft $tag targets $draft_sha, but this workflow is running from $GITHUB_SHA. Re-run the original workflow or bump the version."
                exit 1
              fi
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
            fi
            echo "Reusing draft $tag from immutable commit $GITHUB_SHA."
          else
            # A tag without a release means this version has already been used.
            # Refuse to recreate it even when the tag points to GITHUB_SHA:
            # rebuilding the same source can still produce a different DMG
            # checksum and leave package-manager metadata pinned to the old one.
            if tag_ref=$(git ls-remote --exit-code --tags origin "refs/tags/$tag" 2>/dev/null); then
              tag_sha=$(awk 'NR == 1 { print $1 }' <<<"$tag_ref")
              echo "::error::Release $tag is missing, but its tag already exists at $tag_sha."
              echo "::error::This version is already consumed; bump the version instead of recreating it."
              exit 1
            fi

            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
            gh release create "$tag" --verify-tag --draft --title "$tag" --generate-notes
          fi

  build:
    needs: create-release
    # macos-26 ships Xcode 26.x which matches the local dev SDK. Earlier
    # macos-15 (Xcode 16.4) silently rendered widget text using
    # .foregroundStyle(.primary)/(.secondary) as transparent inside
    # `containerBackground(.fill.tertiary, for: .widget)` — every label
    # and hero number disappeared in shipped DMGs even though the same
    # source rendered fine locally. Pinning to macos-26 keeps the SDK in
    # sync with local builds.
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/v${{ inputs.version }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: ${{ inputs.no_cache && '' || 'npm' }}
          cache-dependency-path: dashboard/package-lock.json

      # Verify version matches package.json AND TokenTrackerBar/project.yml.
      # Skipping the project.yml check once shipped v0.5.77 as a DMG whose
      # Info.plist still advertised 0.5.76 — keep both in lockstep.
      - name: Verify version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "$PKG_VERSION" != "${{ inputs.version }}" ]]; then
            echo "::error::package.json version ($PKG_VERSION) does not match input (${{ inputs.version }})"
            exit 1
          fi

          # Every MARKETING_VERSION in project.yml (app + widget targets) must
          # equal the requested release version; otherwise the built .app
          # carries a CFBundleShortVersionString that disagrees with the tag.
          PROJECT_YML="TokenTrackerBar/project.yml"
          # BSD sed on macOS runners does NOT understand \s — use [[:space:]].
          MISMATCHED=$(grep -E '^[[:space:]]*MARKETING_VERSION:' "$PROJECT_YML" \
            | sed -E 's/.*MARKETING_VERSION:[[:space:]]*"([^"]+)".*/\1/' \
            | sort -u \
            | grep -v "^${{ inputs.version }}$" || true)
          if [ -n "$MISMATCHED" ]; then
            echo "::error::$PROJECT_YML has MARKETING_VERSION value(s) not matching ${{ inputs.version }}: $MISMATCHED"
            exit 1
          fi

      # 1. Build dashboard
      - name: Install dashboard dependencies
        run: npm ci --prefix dashboard --no-audit --no-fund

      # InsForge URL + anon key are public client-side values (shipped in every
      # dashboard bundle). They MUST be present at build time or Vite inlines
      # empty strings, which breaks the leaderboard page (no baseUrl → no fetch)
      # and disables cloud OAuth (`isCloudInsforgeConfigured()` returns false).
      # `dashboard/.env.local` is gitignored so CI cannot read it — inject here.
      - name: Build dashboard
        env:
          VITE_INSFORGE_BASE_URL: https://srctyff5.us-east.insforge.app
          VITE_INSFORGE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3OC0xMjM0LTU2NzgtOTBhYi1jZGVmMTIzNDU2NzgiLCJlbWFpbCI6ImFub25AaW5zZm9yZ2UuY29tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNDU5NDd9.T0auta_IrVIh0uXW1bob5QSnzvsnJmN28r5XkSGEuQY
        run: npm run dashboard:build

      # 2. Bundle EmbeddedServer (Node.js + tokentracker source)
      - name: Cache Node.js binaries for EmbeddedServer
        if: ${{ !inputs.no_cache }}
        uses: actions/cache@v6
        with:
          path: /tmp/node-cache
          key: node-darwin-universal-22.22.2

      - name: Bundle EmbeddedServer
        env:
          NODE_CACHE_DIR: /tmp/node-cache
        run: bash TokenTrackerBar/scripts/bundle-node.sh

      # 3. Generate Xcode project
      - name: Cache Homebrew bottles
        if: ${{ !inputs.no_cache }}
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/Homebrew/downloads
            ~/Library/Caches/Homebrew/api
          key: homebrew-${{ runner.os }}-xcodegen-create-dmg

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: TokenTrackerBar
        run: xcodegen generate

      - name: Patch pbxproj for icon
        working-directory: TokenTrackerBar
        run: ruby scripts/patch-pbxproj-icon.rb

      # 4. Build app
      - name: Build TokenTrackerBar
        working-directory: TokenTrackerBar
        run: |
          xcodebuild \
            -scheme TokenTrackerBar \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_SWIFT_FLAGS="\$(inherited) -Xfrontend -solver-expression-time-threshold=120" \
            clean build

          # Verify universal binary — fail loudly if Intel slice is missing
          # (PRODUCT_NAME is "TokenTracker"; the scheme stays TokenTrackerBar)
          APP_BIN="$(find build/DerivedData/Build/Products/Release -name 'TokenTracker' -path '*/MacOS/*' -maxdepth 5)"
          echo "Built binary: $APP_BIN"
          lipo -info "$APP_BIN"
          if ! lipo -info "$APP_BIN" 2>&1 | grep -q "x86_64"; then
            echo "::error::Binary is NOT universal — missing x86_64 slice. Intel Macs will show a prohibited icon."
            exit 1
          fi
          echo "✓ Universal binary confirmed (arm64 + x86_64)"

      # 4b. Ad-hoc sign — without this, Gatekeeper rejects the downloaded .app
      # as "damaged" because CODE_SIGNING_ALLOWED=NO above produced an entirely
      # unsigned bundle. Ad-hoc signing ("-" identity) makes the error message
      # downgrade to "unidentified developer" which the user can right-click → Open.
      # For a fully trusted install you still need Developer ID + notarization.
      #
      # CRITICAL ORDERING — sign inner-to-outer, NOT with --deep:
      #   1. Inner Mach-O binaries (node, dylibs)
      #   2. The widget extension appex with its OWN entitlements
      #      (must include com.apple.security.app-sandbox or pkd will refuse
      #      to load it with "plug-ins must be sandboxed", and the widget
      #      gallery will silently never list TokenTracker)
      #   3. The outer .app bundle with the host's entitlements, WITHOUT
      #      --deep (otherwise the host entitlements get recursively
      #      re-applied to the appex, stripping its app-sandbox key — the
      #      host is intentionally not sandboxed because it forks Node)
      - name: Ad-hoc sign app
        working-directory: TokenTrackerBar
        run: |
          APP_PATH="$(find build/DerivedData/Build/Products/Release -name 'TokenTracker.app' -maxdepth 1)"
          APPEX_PATH="$APP_PATH/Contents/PlugIns/TokenTrackerWidget.appex"
          echo "Signing: $APP_PATH"

          # 1. Sign nested Mach-O binaries (inner-to-outer)
          find "$APP_PATH/Contents/Resources/EmbeddedServer" -type f \
            \( -name 'node' -o -name '*.dylib' -o -name '*.so' -o -name '*.node' \) \
            -exec codesign --force --timestamp=none --sign - {} \;

          # 2. Sign the widget extension appex with the WIDGET entitlements
          #    (app-sandbox + app-group). Must happen BEFORE signing the host
          #    so the appex's seal references its own entitlements file.
          if [ -d "$APPEX_PATH" ]; then
            echo "Signing widget extension: $APPEX_PATH"
            codesign --force --timestamp=none \
              --entitlements TokenTrackerWidget/TokenTrackerWidget.entitlements \
              --sign - "$APPEX_PATH"
          else
            echo "::warning::Widget extension not found at $APPEX_PATH"
          fi

          # 3. Sign the outer .app bundle with the host entitlements.
          #    NO --deep here — that would recursively re-sign the appex
          #    with the host's entitlements (which lack app-sandbox) and
          #    pkd would reject the widget at runtime.
          codesign --force --timestamp=none \
            --entitlements TokenTrackerBar/TokenTrackerBar.entitlements \
            --sign - "$APP_PATH"

          # Verify
          codesign --verify --verbose=2 "$APP_PATH"
          codesign -dv --verbose=2 "$APP_PATH" 2>&1 | head -8

          # Sanity-check that the widget extension still has app-sandbox
          # after the outer signing pass — this is the exact failure mode
          # that silently breaks widget discovery, so fail loudly here.
          if [ -d "$APPEX_PATH" ]; then
            echo "Verifying widget extension entitlements:"
            codesign -d --entitlements - "$APPEX_PATH" 2>&1 | tee /tmp/appex-ents.txt
            if ! grep -q "com.apple.security.app-sandbox" /tmp/appex-ents.txt; then
              echo "::error::Widget extension is missing com.apple.security.app-sandbox after signing — pkd will refuse to load it and the widget gallery will not list TokenTracker"
              exit 1
            fi
            echo "✓ Widget extension still has app-sandbox entitlement"
          fi

      # 5. Create DMG (uses Homebrew `create-dmg` for headless background + layout)
      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        working-directory: TokenTrackerBar
        run: |
          APP_PATH="$(find build/DerivedData/Build/Products/Release -name 'TokenTracker.app' -maxdepth 1)"
          echo "App path: $APP_PATH"
          bash scripts/create-dmg.sh "$APP_PATH"

      # 6. Attach the DMG to the draft release that create-release made.
      # --clobber so re-runs replace the asset; the Windows job uploads its own
      # assets to the same draft in parallel. The release is still a draft here,
      # so nothing is public yet — the publish job flips it live.
      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" != "true" ]; then
            echo "::error::Refusing to overwrite assets on published release $tag."
            exit 1
          fi
          gh release upload "$tag" \
            TokenTrackerBar/build/TokenTrackerBar.dmg --clobber

  # Build + attach the Windows tray app to the SAME vX.Y.Z release, so one
  # `gh workflow run "release DMG" -f version=X.Y.Z` ships both platforms.
  # `needs: create-release` (NOT `needs: build`) so Windows builds in PARALLEL
  # with the macOS DMG — both just upload to the already-created release.
  windows:
    needs: create-release
    permissions:
      contents: write
    uses: ./.github/workflows/release-windows.yml
    with:
      version: ${{ inputs.version }}
      no_cache: ${{ inputs.no_cache }}

  # Build + attach the Linux AppImage to the SAME vX.Y.Z release, so one
  # `gh workflow run "release (macOS + Windows + Linux)" -f version=X.Y.Z` ships
  # all three platforms. `needs: create-release` (NOT `needs: build`) so Linux
  # builds in PARALLEL with the macOS DMG and the Windows assets.
  #
  # Exactly ONE artifact is produced (bundle.targets is ["appimage"]): an
  # AppImage runs on any reasonably current glibc distro without a package
  # manager, so there is no .deb/.rpm matrix to maintain.
  linux:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/v${{ inputs.version }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          # Node 20 matches the macOS release job; the Node runtime that ships
          # INSIDE the app is pinned separately by bundle-node-linux.sh.
          node-version: 20
          cache: ${{ inputs.no_cache && '' || 'npm' }}
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json
            TokenTrackerLinux/package-lock.json

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      # Verifies package.json AND every managed version file, including
      # TokenTrackerLinux's Cargo.toml / Cargo.lock / tauri.conf.json / PKGBUILD.
      # A stale Cargo.toml would ship an AppImage whose embedded version
      # disagrees with the tag.
      - name: Verify version
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "$PKG_VERSION" != "${{ inputs.version }}" ]]; then
            echo "::error::package.json version ($PKG_VERSION) does not match input (${{ inputs.version }})"
            exit 1
          fi
          npm run validate:versions

      # webkit2gtk + gtk3 + libayatana-appindicator are the runtime libraries
      # the tauri crate links against; librsvg is needed for icon rasterization.
      - name: Install Tauri build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            desktop-file-utils \
            fuse3 \
            rpm \
            cpio

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        if: ${{ !inputs.no_cache }}
        with:
          workspaces: TokenTrackerLinux/src-tauri

      - name: Install dashboard dependencies
        run: npm ci --prefix dashboard --no-audit --no-fund

      # Same public client-side values as the macOS job: absent at build time
      # Vite inlines empty strings, breaking the leaderboard and cloud OAuth.
      - name: Build dashboard
        env:
          VITE_INSFORGE_BASE_URL: https://srctyff5.us-east.insforge.app
          VITE_INSFORGE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3OC0xMjM0LTU2NzgtOTBhYi1jZGVmMTIzNDU2NzgiLCJlbWFpbCI6ImFub25AaW5zZm9yZ2UuY29tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNDU5NDd9.T0auta_IrVIh0uXW1bob5QSnzvsnJmN28r5XkSGEuQY
        run: npm run dashboard:build

      - name: Install Linux client dependencies
        run: npm ci --prefix TokenTrackerLinux --no-audit --no-fund

      # Downloads the pinned Node binary and stages bin/ + src/ + dashboard/dist
      # into TokenTrackerLinux/EmbeddedServer. MUST run before `tauri build`:
      # tauri.bundle.conf.json declares EmbeddedServer as a bundle resource and
      # tauri-build hard-fails on a missing resource path.
      - name: Bundle EmbeddedServer
        run: npm --prefix TokenTrackerLinux run bundle:node

      - name: Build Linux packages
        run: npm --prefix TokenTrackerLinux run build

      # Rename to stable, predictable asset names (Tauri emits
      # TokenTracker_<version>_amd64.AppImage / _amd64.deb / -1.x86_64.rpm) and
      # prove each bundle actually carries the embedded runtime. Without this
      # check a broken resource mapping would ship a package that starts and
      # then fails to find tracker.js on every user's machine. Every format gets
      # the same check: the AppImage bundles its own GTK/WebKit while deb and rpm
      # rely on system libraries, so they are built by separate tauri bundlers
      # and can fail independently.
      - name: Verify and stage the Linux packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle_root="TokenTrackerLinux/src-tauri/target/release/bundle"
          mkdir -p dist-linux

          # Assert the extracted package tree carries a complete runtime.
          verify_payload() {
            local label="$1" root="$2"

            if [ ! -e "$root/usr/bin/tokentracker-linux" ]; then
              echo "::error::$label is missing usr/bin/tokentracker-linux"
              exit 1
            fi

            # Locate the runtime by searching rather than hardcoding the resource
            # directory name: Tauri derives it from productName, and paths.rs
            # resolves it at runtime. What matters here is that it is complete.
            local node_bin
            node_bin="$(find "$root/usr/lib" -type f -name node -path '*/EmbeddedServer/*' -print -quit)"
            if [ -z "$node_bin" ]; then
              echo "::error::$label carries no EmbeddedServer/node -- the bundle.resources mapping did not apply"
              find "$root/usr/lib" -maxdepth 3 | head -50
              exit 1
            fi
            echo "$label embedded runtime: ${node_bin#"$root"}"

            local missing=0 required
            for required in \
              "tokentracker/bin/tracker.js" \
              "tokentracker/package.json" \
              "tokentracker/dashboard/dist/index.html"
            do
              if [ ! -e "$(dirname "$node_bin")/$required" ]; then
                echo "::error::$label is missing EmbeddedServer/$required"
                missing=1
              fi
            done
            if [ "$missing" -ne 0 ]; then
              find "$(dirname "$node_bin")" -maxdepth 3 | head -50
              exit 1
            fi

            # The bundled Node must stay executable or `serve` can never start.
            if [ ! -x "$node_bin" ]; then
              echo "::error::$label bundled Node is not executable"
              exit 1
            fi
          }

          # The browser returns OAuth sign-in through tokentracker://. deb and rpm
          # rely on their packaged desktop entry for that (the AppImage registers
          # its own at runtime), so a package without it can never sign in.
          verify_scheme_handler() {
            local label="$1" desktop="$2/usr/share/applications/TokenTracker.desktop"
            if [ ! -f "$desktop" ]; then
              echo "::error::$label is missing usr/share/applications/TokenTracker.desktop"
              exit 1
            fi
            if ! grep -Fxq 'MimeType=x-scheme-handler/tokentracker;' "$desktop" \
              || ! grep -Fxq 'Exec=tokentracker-linux %u' "$desktop"; then
              echo "::error::$label desktop entry does not register tokentracker://"
              cat "$desktop"
              exit 1
            fi
          }

          # Exactly one artifact per format, so a silent extra build is caught.
          pick_one() {
            local label="$1"; shift
            local found=("$@")
            if [ "${#found[@]}" -ne 1 ]; then
              echo "::error::Expected exactly 1 $label, found ${#found[@]}: ${found[*]-none}" >&2
              exit 1
            fi
            printf '%s' "${found[0]}"
          }

          workdir="$(mktemp -d)"

          # --- AppImage -------------------------------------------------------
          image="$(pick_one AppImage "$bundle_root"/appimage/*.AppImage)"
          echo "Built: $image"
          cp "$image" "$workdir/app.AppImage"
          chmod +x "$workdir/app.AppImage"
          # Extract rather than mount so the check does not depend on FUSE.
          (cd "$workdir" && ./app.AppImage --appimage-extract >/dev/null)
          verify_payload "AppImage" "$workdir/squashfs-root"
          cp "$image" "dist-linux/TokenTracker-linux-x86_64.AppImage"

          # --- deb ------------------------------------------------------------
          deb="$(pick_one deb "$bundle_root"/deb/*.deb)"
          echo "Built: $deb"
          mkdir -p "$workdir/deb"
          dpkg-deb -x "$deb" "$workdir/deb"
          verify_payload "deb" "$workdir/deb"
          verify_scheme_handler "deb" "$workdir/deb"
          cp "$deb" "dist-linux/TokenTracker-linux-x86_64.deb"

          # --- rpm ------------------------------------------------------------
          rpm_pkg="$(pick_one rpm "$bundle_root"/rpm/*.rpm)"
          echo "Built: $rpm_pkg"
          mkdir -p "$workdir/rpm"
          rpm_abs="$(realpath "$rpm_pkg")"
          # Some rpm2cpio/cpio combinations return a non-zero status after
          # extracting the complete payload (for example on an archive trailer).
          # Treat that status as diagnostic only; verify_payload below remains
          # the authoritative, fail-closed check for the shipped runtime.
          if ! (cd "$workdir/rpm" && rpm2cpio "$rpm_abs" | cpio -idm --quiet); then
            echo "::warning::RPM extraction returned a non-zero status; checking the extracted payload"
          fi
          verify_payload "rpm" "$workdir/rpm"
          verify_scheme_handler "rpm" "$workdir/rpm"
          cp "$rpm_pkg" "dist-linux/TokenTracker-linux-x86_64.rpm"

          rm -rf "$workdir"
          ls -la dist-linux

      - name: Upload Linux packages to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" != "true" ]; then
            echo "::error::Refusing to overwrite assets on published release $tag."
            exit 1
          fi
          gh release upload "$tag" \
            dist-linux/TokenTracker-linux-x86_64.AppImage \
            dist-linux/TokenTracker-linux-x86_64.deb \
            dist-linux/TokenTracker-linux-x86_64.rpm --clobber

  # Flip the draft live ONLY after ALL THREE platforms finished uploading, so the
  # release appears complete and atomically — releases/latest stays on the
  # previous version until this instant, never a partial release. If either
  # build fails, the release stays a draft (invisible) instead of going public
  # half-empty. The Homebrew tap is notified HERE (not in the build job) so it
  # fetches a release that is both public and fully populated — fixing the race
  # where the tap saw vX.Y.Z before the DMG asset existed.
  publish:
    needs: [build, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify every platform asset landed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" != "true" ]; then
            echo "::error::Release $tag is no longer a draft; refusing to mutate a published release."
            exit 1
          fi

          for asset in TokenTrackerBar.dmg TokenTracker-win-x64.zip TokenTracker-Setup.exe TokenTracker-linux-x86_64.AppImage TokenTracker-linux-x86_64.deb TokenTracker-linux-x86_64.rpm; do
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
              echo "::error::Draft $tag is missing required asset: $asset"
              exit 1
            fi
          done

      # Checksums are produced HERE, between "all assets landed" and the un-draft, so
      # a release is never public -- and never reachable by an updater -- without them.
      # We hash the DOWNLOADED assets rather than each build job's local copy: that is
      # what proves the bytes GitHub actually serves, which is the only thing a client
      # can check. The Windows updater verifies TokenTracker-Setup.exe against this
      # file before it executes the installer (TokenTrackerWin/UpdateIntegrity.cs).
      #
      # SHA256SUMS is a DERIVED seventh asset, deliberately not part of the required
      # asset list above: that list gates the six artifacts the platform jobs build.
      - name: Publish SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          workdir="$(mktemp -d)"
          # OUTSIDE $workdir on purpose: a "> $workdir/SHA256SUMS" redirection is set
          # up before find lists the directory, so the file would hash itself (empty).
          sums="$workdir.SHA256SUMS"

          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$workdir"
          # A resumed/re-run publish would otherwise hash the previous SHA256SUMS.
          rm -f "$workdir/SHA256SUMS"

          # Standard sha256sum format ("<hash>  <name>"), sorted for a stable diff, so
          # `sha256sum -c SHA256SUMS` works as-is next to the downloaded files.
          ( cd "$workdir" && find . -maxdepth 1 -type f -printf '%P\n' | sort | xargs -r sha256sum ) > "$sums"
          if [ ! -s "$sums" ]; then
            echo "::error::Computed no checksums for $tag."
            exit 1
          fi
          if grep -q ' SHA256SUMS$' "$sums"; then
            echo "::error::SHA256SUMS listed itself."
            exit 1
          fi
          cat "$sums"

          cp "$sums" "$workdir/SHA256SUMS"
          gh release upload "$tag" "$workdir/SHA256SUMS" --clobber --repo "$GITHUB_REPOSITORY"

          # `gh release edit --notes` REPLACES the body, and the body here is the
          # --generate-notes output we must keep. So read it back, drop anything from
          # our marker on (which makes a re-run idempotent), and append the table.
          notes="$workdir.notes.md"   # outside $workdir: nothing new may appear there
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' \
            | awk '/^<!-- sha256sums -->$/ { exit } { print }' > "$notes"
          {
            echo "<!-- sha256sums -->"
            echo
            echo "### SHA-256 checksums"
            echo
            echo '```'
            cat "$sums"
            echo '```'
          } >> "$notes"
          gh release edit "$tag" --notes-file "$notes" --repo "$GITHUB_REPOSITORY"

      - name: Flip the draft live
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          gh release edit "$tag" --draft=false --latest --repo "$GITHUB_REPOSITORY"

      - name: Dispatch homebrew tap update
        env:
          HOMEBREW_DISPATCH_TOKEN: ${{ secrets.HOMEBREW_DISPATCH_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "${HOMEBREW_DISPATCH_TOKEN:-}" ]; then
            echo "HOMEBREW_DISPATCH_TOKEN not set — tap will update via hourly cron."
            exit 0
          fi
          curl -sSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $HOMEBREW_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/xiufengsun/homebrew-tokentracker/dispatches \
            -d "{\"event_type\":\"tokentracker-release\",\"client_payload\":{\"source\":\"dmg\",\"version\":\"$VERSION\"}}"
