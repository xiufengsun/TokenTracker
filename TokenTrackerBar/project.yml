name: TokenTrackerBar
options:
  bundleIdPrefix: com.tokentracker
  deploymentTarget:
    macOS: "12.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "12.0"

packages:
  Vortex:
    url: https://github.com/zats/Vortex
    revision: ef5392088d4aeb255c4eee83157dbdafcd31bf07

targets:
  TokenTrackerBar:
    type: application
    platform: macOS
    sources:
      - path: TokenTrackerBar
        excludes:
          - "EmbeddedServer/**"
          - "AppIcon.icon"
      - path: Shared
    dependencies:
      - target: TokenTrackerWidget
      - package: Vortex
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokentracker.bar
        # App bundle / process / permission-dialog name. Target & scheme stay
        # "TokenTrackerBar"; the shipped DMG keeps the stable TokenTrackerBar.dmg
        # filename (download URLs depend on it).
        PRODUCT_NAME: TokenTracker
        INFOPLIST_VALUES: |
          LSUIElement = YES
        MARKETING_VERSION: "1.3.5"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: NO
        COPY_PHASE_STRIP: NO
        STRIP_INSTALLED_PRODUCT: NO
    info:
      path: TokenTrackerBar/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: TokenTracker
        # Keep in sync with CFBundleDisplayName: the app menu title uses CFBundleName.
        CFBundleName: TokenTracker
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLName: com.tokentracker.bar.auth
            CFBundleURLSchemes:
              - tokentracker
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    postBuildScripts:
      - script: |
          SRC_DIR="${SRCROOT}/EmbeddedServer"
          DST_DIR="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/EmbeddedServer"
          if [ -d "$SRC_DIR" ]; then
            rm -rf "$DST_DIR"
            cp -a "$SRC_DIR" "$DST_DIR"
            chmod +x "$DST_DIR/node"
          fi
          exit 0
        name: "Copy EmbeddedServer to app bundle"
    entitlements:
      path: TokenTrackerBar/TokenTrackerBar.entitlements
      properties:
        com.apple.security.network.client: true

  # Acceptance-only app, using the real window/bridge sources without a widget dependency.
  TokenTrackerNativeQA:
    type: application
    platform: macOS
    sources:
      - path: TokenTrackerBar
        excludes:
          - "EmbeddedServer/**"
          - "AppIcon.icon"
      - path: Shared
    dependencies:
      - package: Vortex
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokentracker.bar.qa
        PRODUCT_NAME: TokenTrackerQA
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TOKENTRACKER_NATIVE_QA"
        ENABLE_APP_SANDBOX: NO
        CODE_SIGNING_ALLOWED: NO
    info:
      path: NativeQA/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: TokenTracker QA
        CFBundleName: TokenTracker QA
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "0.0.0"
        CFBundleURLTypes:
          - CFBundleURLName: com.tokentracker.bar.qa.billing
            CFBundleURLSchemes:
              - tokentracker-qa
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    postBuildScripts:
      - script: |
          SRC_DIR="${SRCROOT}/EmbeddedServer"
          DST_DIR="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/EmbeddedServer"
          if [ -d "$SRC_DIR" ]; then
            rm -rf "$DST_DIR"
            cp -a "$SRC_DIR" "$DST_DIR"
            chmod +x "$DST_DIR/node"
          fi
          exit 0
        name: "Copy EmbeddedServer to QA bundle"

  TokenTrackerWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: TokenTrackerWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokentracker.bar.widget
        PRODUCT_NAME: TokenTrackerWidget
        MARKETING_VERSION: "1.3.5"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
    info:
      path: TokenTrackerWidget/Info.plist
      properties:
        CFBundleDisplayName: TokenTracker Widgets
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: TokenTrackerWidget/TokenTrackerWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true

  TokenTrackerBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TokenTrackerBarTests
      - path: TokenTrackerBar/Models/LimitsSettingsStore.swift
      - path: TokenTrackerBar/Models/MenuBarDisplayPreferences.swift
      - path: TokenTrackerBar/Models/DynamicIslandLayoutPolicy.swift
      - path: TokenTrackerBar/Models/DynamicIslandCompactPolicy.swift
      - path: TokenTrackerBar/Models/PopoverPlacementPolicy.swift
      - path: TokenTrackerBar/Models/MenuBarIconStyle.swift
      - path: TokenTrackerBar/Models/UsageLimits.swift
      - path: TokenTrackerBar/Models/LimitPace.swift
      - path: TokenTrackerBar/Models/WeeklyLimitResetDetector.swift
      # The Limits panel renders hand-entered subscription bars from
      # SubscriptionCycle; compile it so that calendar math is unit-tested
      # natively instead of only by the dashboard's JS twin.
      - path: TokenTrackerBar/Models/Subscription.swift
      - path: TokenTrackerBar/Models/BackgroundRefreshPolicy.swift
      - path: TokenTrackerBar/Models/SyncRequestPolicy.swift
      - path: TokenTrackerBar/Models/UsagePublicationPolicy.swift
      - path: TokenTrackerBar/Models/DashboardPresentationPolicy.swift
      - path: TokenTrackerBar/Services/ResumableDownloader.swift
      - path: TokenTrackerBar/Services/LocalAPIConfiguration.swift
      - path: TokenTrackerBar/Services/QueueActivityMonitor.swift
      - path: TokenTrackerBar/Models/CompanionAnimationPolicy.swift
      - path: TokenTrackerBar/Models/ServerHealthCheckPolicy.swift
      - path: TokenTrackerBar/Utilities/DateHelpers.swift
      - path: TokenTrackerBar/Utilities/TokenFormatter.swift
      - path: TokenTrackerBar/Models/AutoUpdatePolicy.swift
      # WeeklyLimitResetDetector's window labels come from Strings, which
      # resolves the locale via Shared/NativeLocalization (Shared is
      # Foundation-only by design, so pulling the whole dir stays cheap).
      - path: TokenTrackerBar/Utilities/Strings.swift
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokentracker.bar.tests
        GENERATE_INFOPLIST_FILE: YES
