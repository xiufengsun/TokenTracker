[package]
name = "tokentracker-linux"
version = "1.1.2"
description = "TokenTracker Linux desktop client"
authors = ["TokenTracker"]
edition = "2021"
license = "MIT"

[lib]
name = "tokentracker_linux"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tokentracker-linux"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[dev-dependencies]
# Used by tests/capabilities.rs to parse `capabilities/*.json` with Tauri's own
# `Capability` type and to exercise `RemoteUrlPattern` matching directly, so the
# loopback port wildcard is asserted against the real matcher rather than assumed.
tauri-utils = "2"
